name: Build & Release Resume & Cover Letter

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      company_name:
        description: 'Target Company Name'
        required: false
        default: 'Target Company Name'
        type: string
      hiring_manager:
        description: 'Hiring Manager Name'
        required: false
        default: 'Hiring Manager'
        type: string
      company_location:
        description: 'Company Location'
        required: false
        default: 'Location'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Timestamp Output
        id: timestamp
        run: echo "ts=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      # Inject workflow inputs into LaTeX variables dynamically
      - name: Prepare Dynamic Cover Letter Parameters
        run: |
          COMPANY="${{ inputs.company_name || 'Target Company Name' }}"
          MANAGER="${{ inputs.hiring_manager || 'Hiring Manager' }}"
          LOCATION="${{ inputs.company_location || 'Location' }}"

          cat <<EOF > cover_letter_dynamic.tex
          \newcommand{\varCompanyName}{${COMPANY}}
          \newcommand{\varHiringManager}{${MANAGER}}
          \newcommand{\varLocation}{${LOCATION}}
          EOF
          
          cat cover_letter.tex >> cover_letter_dynamic.tex

      # Compile Resume PDF
      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      # Compile Cover Letter PDF using dynamic wrapper
      - name: Compile Cover Letter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover_letter_dynamic.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Rename Cover Letter Output
        run: mv cover_letter_dynamic.pdf cover_letter.pdf

      # --- ALWAYS RUNS (Manual & Push): Downloadable via Workflow Artifacts ---
      - name: Upload Cover Letter Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cover_Letter_${{ steps.timestamp.outputs.ts }}
          path: cover_letter.pdf
          retention-days: 7

      - name: Upload CV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resume_${{ steps.timestamp.outputs.ts }}
          path: resume.pdf
          retention-days: 7

      # --- ONLY RUNS ON 'PUSH' TO MASTER/MAIN: Updates Pages & GitHub Release ---
      - name: Prepare Public Files
        if: github.event_name == 'push'
        run: |
          mkdir -p public
          cp resume.pdf public/Arpit_Jain_CV.pdf
          cp cover_letter.pdf public/Arpit_Jain_Cover_Letter.pdf
          if [ -f index.html ]; then cp index.html public/; fi
          
          cp resume.pdf "Arpit_Jain_CV_${{ steps.timestamp.outputs.ts }}.pdf"
          cp cover_letter.pdf "Arpit_Jain_Cover_Letter_${{ steps.timestamp.outputs.ts }}.pdf"

      - name: Setup Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.timestamp.outputs.ts }}
          name: "Release ${{ steps.timestamp.outputs.ts }}"
          body: "Automated release containing the latest master CV and Cover Letter PDFs."
          files: |
            Arpit_Jain_CV_${{ steps.timestamp.outputs.ts }}.pdf
            Arpit_Jain_Cover_Letter_${{ steps.timestamp.outputs.ts }}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}