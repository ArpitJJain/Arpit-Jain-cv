name: Build Resume & Cover Letter

on:
  push:
    branches:
      - main

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Compile Cover Letter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover_letter.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Generate Timestamp & Copy PDFs
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H%M%S')
          mkdir -p public
          
          # Move to public folder for GitHub Pages
          cp resume.pdf public/
          cp cover_letter.pdf public/
          cp index.html public/
          
          # Save timestamped copies
          cp resume.pdf "Arpit_Jain_CV_${TIMESTAMP}.pdf"
          cp cover_letter.pdf "Arpit_Jain_CoverLetter_${TIMESTAMP}.pdf"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public