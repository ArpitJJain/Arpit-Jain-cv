name: Build & Release Resume & Cover Letter

on:
  push:
    branches:
      - master
    tags:
      - 'v*' # Triggers GitHub Release when you push a tag like v1.0.0

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Compile Cover Letter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover_letter.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Prepare Artifacts & Web Files
        run: |
          mkdir -p public
          
          # Web view files
          cp resume.pdf public/
          cp cover_letter.pdf public/
          cp index.html public/
          
          # Renamed PDF files for GitHub Release assets
          cp resume.pdf Arpit_Jain_CV.pdf
          cp cover_letter.pdf Arpit_Jain_Cover_Letter.pdf

      - name: Upload Both Artifacts (Actions Storage)
        uses: actions/upload-artifact@v4
        with:
          name: Resume-And-CoverLetter
          path: |
            Arpit_Jain_CV.pdf
            Arpit_Jain_Cover_Letter.pdf

      - name: Deploy Web Page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # Automatically create a GitHub Release with attached PDFs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Arpit_Jain_CV.pdf
            Arpit_Jain_Cover_Letter.pdf
          name: "Release ${{ github.ref_name }}"
          body: "Automated release containing the latest CV and Cover Letter PDFs."
          draft: false
          prerelease: false