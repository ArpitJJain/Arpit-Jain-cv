name: Build & Release Resume & Cover Letter

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    # Required for native GitHub Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Timestamp Output
        id: timestamp
        run: |
          echo "ts=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Compile Cover Letter
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cover_letter.tex
          args: "-pdf -interaction=nonstopmode -halt-on-error"

      - name: Prepare Artifacts & Web Files
        run: |
          mkdir -p public
          
          # Web view & download files
          cp resume.pdf public/Arpit_Jain_CV.pdf
          cp cover_letter.pdf public/Arpit_Jain_Cover_Letter.pdf
          cp index.html public/
          
          # Renamed PDF files with timestamps for GitHub Release assets
          cp resume.pdf "Arpit_Jain_CV_${{ steps.timestamp.outputs.ts }}.pdf"
          cp cover_letter.pdf "Arpit_Jain_Cover_Letter_${{ steps.timestamp.outputs.ts }}.pdf"

      # Upload Pages artifact for native GitHub Pages deployment
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.timestamp.outputs.ts }}
          name: "Release ${{ steps.timestamp.outputs.ts }}"
          body: "Automated release containing the latest CV and Cover Letter PDFs."
          draft: false
          prerelease: false
          files: |
            Arpit_Jain_CV_${{ steps.timestamp.outputs.ts }}.pdf
            Arpit_Jain_Cover_Letter_${{ steps.timestamp.outputs.ts }}.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}